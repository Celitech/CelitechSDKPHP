name: Release

# Runs when a merge to main changes the SDK version: creates the tag v<version> and the GitHub release,
# then asks Packagist to sync. Packagist publishes PHP packages from git tags, so the tag is the release;
# there is nothing to upload. Same flow as the Postman workflow it replaces. Kept out of Fern's
# regeneration by .fernignore.
#
# The version is read from .manifest.json (config.target.sdkVersion): Fern's composer.json has no version.
on:
  push:
    branches: [main]
    paths:
      - '.manifest.json'
      - 'composer.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: pkg
        run: |
          version=$(node -p "require('./.manifest.json').config.target.sdkVersion")
          if [ -z "$version" ] || [ "$version" = "undefined" ]; then
            echo "::error::config.target.sdkVersion not found in .manifest.json"
            exit 1
          fi
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.pkg.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists; nothing to release"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      # Packagist also syncs on its own through the GitHub webhook; this ping makes it immediate.
      # It only runs when both Packagist secrets are set.
      - name: Notify Packagist
        if: steps.release.outputs.created == 'true'
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
        run: |
          if [ -z "$PACKAGIST_USERNAME" ] || [ -z "$PACKAGIST_API_TOKEN" ]; then
            echo "::notice::Packagist secrets not set; relying on the GitHub webhook to sync celitech-sdk/sdk"
            exit 0
          fi
          curl -sf -X POST -H 'content-type:application/json' \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_API_TOKEN}" \
            -d "{\"repository\":{\"url\":\"https://github.com/${{ github.repository }}\"}}"
